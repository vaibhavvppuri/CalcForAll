[versions]
kotlin = "2.1.0"
kotest = "5.9.1"
bigmath = "2.3.2"
ktor = "3.0.3"
agp = "8.7.2"
androidxCore = "1.13.1"
androidxAppcompat = "1.7.0"
# Compose BOM 2024.06.00 = Compose UI 1.6.8 / material3 1.2.1 — the newest line
# that supports compileSdk 34 (Compose 1.7+ demands compileSdk 35).
composeBom = "2024.06.00"
activityCompose = "1.9.0"
# On-device (instrumented) tests only — never in the shipped APK.
androidxTestRunner = "1.5.2"
androidxTestExtJunit = "1.1.5"
# ML Kit version pinned here for the throwaway spike (mlkit-spike/), which is NOT
# a Gradle module — see mlkit-spike/README.md. Kept out of the build on purpose.
mlkitDigitalInk = "18.1.0"

[libraries]
# --- core (pure JVM; NO android/androidx, ever — Article 1) ---
bigmath = { module = "ch.obermuhlner:big-math", version.ref = "bigmath" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }

# --- api (Ktor, JVM) ---
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }

# --- android (only ever on the android module's classpath) ---
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# Since Kotlin 2.0 the Compose compiler ships with Kotlin itself — same version ref.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
